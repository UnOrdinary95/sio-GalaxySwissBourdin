openapi: 3.1.0
info:
    title: GalaxySwissBourdin API
    description: API pour la gestion des visites médicales et des praticiens du laboratoire GSB.
    version: 1.0.0
servers:
    - url: http://localhost:3100
      description: Serveur de développement

tags:
    - name: Auth
      description: Authentification et création de compte
    - name: Medecins
      description: Gestion des médecins et praticiens
    - name: Rapports
      description: Gestion des rapports de visite

paths:
    /auth/register:
        post:
            tags:
                - Auth
            summary: Créer un compte visiteur
            description: Crée un nouveau compte visiteur médical. **Middlewares:** validateBody(registerInputSchema)
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterInput'
                        examples:
                            valid:
                                summary: Exemple valide
                                value:
                                    nom: Dupont
                                    prenom: Jean
                                    login: jdupont
                                    mdp: password123
                                    adresse: 123 Rue de Paris
                                    cp: '75001'
                                    ville: Paris
            responses:
                '201':
                    description: Visiteur créé avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessMessage'
                            examples:
                                success:
                                    $ref: '#/components/examples/ExampleRegisterSuccess'
                '400':
                    description: Erreur de validation (format/type invalide)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiValidationError'
                            examples:
                                missingField:
                                    $ref: '#/components/examples/ErrZodMissingField'
                                fieldTooLong:
                                    $ref: '#/components/examples/ErrZodFieldTooLong'
                '409':
                    description: Conflit - Un visiteur avec ce login existe déjà
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                conflict:
                                    $ref: '#/components/examples/ErrConflictLoginExists'
                '500':
                    description: Erreur serveur interne
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                internal:
                                    $ref: '#/components/examples/ErrDatabaseInternal'

    /auth/login:
        post:
            tags:
                - Auth
            summary: Authentifier un visiteur
            description: Authentifie un visiteur avec ses identifiants (login, mdp) et retourne un token JWT. **Middlewares:** validateBody(loginInputSchema)
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginInput'
                        examples:
                            valid:
                                summary: Exemple valide
                                value:
                                    login: jdupont
                                    mdp: password123
            responses:
                '200':
                    description: Authentification réussie, cookie token posé, profil retourné
                    headers:
                        Set-Cookie:
                            schema:
                                type: string
                                example: 'token=<jwt>; HttpOnly; Secure; SameSite=Lax (ou None en dev); Max-Age=86400000'
                            description: Token JWT en cookie httpOnly valide 1 jour (SameSite=Lax en prod, None en dev pour localhost cross-origin)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessVisiteurPublic'
                            examples:
                                success:
                                    $ref: '#/components/examples/ExampleLoginSuccess'
                '400':
                    description: Erreur de validation (champs manquants ou format invalide)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiValidationError'
                            examples:
                                missingField:
                                    $ref: '#/components/examples/ErrZodLoginMissing'
                                fieldTooLong:
                                    $ref: '#/components/examples/ErrZodLoginTooLong'
                '401':
                    description: Identifiants invalides (login ou mdp incorrect)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                invalidCredentials:
                                    $ref: '#/components/examples/ErrAuthInvalidCredentials'
                '500':
                    description: Erreur serveur interne
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                internal:
                                    $ref: '#/components/examples/ErrDatabaseInternal'

    /auth/logout:
        post:
            tags:
                - Auth
            summary: Déconnecter un visiteur
            description: Supprime le cookie token et déconnecte le visiteur. Opération idempotente (retourne toujours 200). **Middlewares:** Aucun
            responses:
                '200':
                    description: Déconnexion réussie
                    headers:
                        Set-Cookie:
                            schema:
                                type: string
                                example: 'token=; HttpOnly; Secure; SameSite=Lax; Max-Age=0'
                            description: Cookie token supprimé (Max-Age=0)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessMessage'
                            examples:
                                success:
                                    $ref: '#/components/examples/ExampleLogoutSuccess'
                '500':
                    description: Erreur serveur interne
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                internal:
                                    $ref: '#/components/examples/ErrDatabaseInternal'

    /auth/me:
        get:
            tags:
                - Auth
            summary: Récupérer le profil de l'utilisateur authentifié
            description: Retourne le profil public de l'utilisateur authentifié. Utilisé pour vérifier l'état de la session (ex: au chargement de l'application). **Middlewares:** requireAuth
            responses:
                '200':
                    description: Connexion réussie
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessVisiteurPublic'
                            examples:
                                success:
                                    $ref: '#/components/examples/ExampleMeSuccess'
                '401':
                    description: Non authentifié (token manquant, invalide ou expiré)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                missingToken:
                                    $ref: '#/components/examples/ErrAuthTokenMissing'
                                invalidToken:
                                    $ref: '#/components/examples/ErrAuthTokenInvalid'
                                expiredToken:
                                    $ref: '#/components/examples/ErrAuthTokenExpired'
                '500':
                    description: Erreur serveur interne
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                internal:
                                    $ref: '#/components/examples/ErrDatabaseInternal'

    /medecins:
        get:
            tags:
                - Medecins
            summary: Récupérer une liste paginée de médecins
            description: Retourne une page de médecins avec pagination simple basée sur l'offset. **Middlewares:** Aucun
            parameters:
                - in: query
                  name: offset
                  schema:
                      type: integer
                      minimum: 0
                      default: 0
                  description: Nombre de médecins à ignorer (offset pour la pagination)
                  required: false
            responses:
                '200':
                    description: Liste paginée de médecins récupérée avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessMedecins'
                            examples:
                                success:
                                    $ref: '#/components/examples/ExampleGetMedecinsSuccess'
                '500':
                    description: Erreur serveur interne
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                internal:
                                    $ref: '#/components/examples/ErrDatabaseMedecins'

    /medecins/search:
        get:
            tags:
                - Medecins
            summary: Rechercher des médecins par nom/prénom
            description: Retourne une page de médecins filtrée par recherche textuelle avec ILIKE (insensible à la casse). **Middlewares:** Aucun
            parameters:
                - in: query
                  name: q
                  schema:
                      type: string
                      minLength: 1
                  description: Terme de recherche pour filtrer les médecins (recherche dans nom et prénom)
                  required: true
                - in: query
                  name: offset
                  schema:
                      type: integer
                      minimum: 0
                      default: 0
                  description: Nombre de médecins à ignorer (offset pour la pagination)
                  required: false
            responses:
                '200':
                    description: Liste paginée de médecins filtrée récupérée avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessMedecins'
                            examples:
                                success:
                                    $ref: '#/components/examples/ExampleGetMedecinsSuccess'
                '400':
                    description: Paramètre de recherche manquant ou invalide
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                missingQuery:
                                    $ref: '#/components/examples/ErrMissingSearchQuery'
                '500':
                    description: Erreur serveur interne
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                internal:
                                    $ref: '#/components/examples/ErrDatabaseMedecins'

    /rapports:
        get:
            tags:
                - Rapports
            summary: Liste les rapports de visite
            description: Récupère tous les rapports filtrés par visiteur ou par médecin. **Middlewares:** requireAuth
            parameters:
                - in: query
                  name: type
                  schema:
                      type: string
                      enum: [visiteur, medecin]
                  description: Type de filtrage (visiteur ou medecin)
                  required: true
                - in: query
                  name: id
                  schema:
                      type: string
                  description: Identifiant du visiteur (char(4)) ou du médecin (integer)
                  required: true
            responses:
                '200':
                    description: Liste des rapports récupérée avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessRapports'
                            examples:
                                success:
                                    $ref: '#/components/examples/ExampleGetRapportsSuccess'
                '400':
                    description: Paramètres de requête invalides
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                invalidParams:
                                    $ref: '#/components/examples/ErrRapportsInvalidParams'
                '401':
                    description: Non authentifié (token manquant, invalide ou expiré)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                missingToken:
                                    $ref: '#/components/examples/ErrAuthTokenMissing'
                                invalidToken:
                                    $ref: '#/components/examples/ErrAuthTokenInvalid'
                                expiredToken:
                                    $ref: '#/components/examples/ErrAuthTokenExpired'
                '500':
                    description: Erreur serveur interne
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                internal:
                                    $ref: '#/components/examples/ErrDatabaseInternal'

    /rapports/{id}:
        put:
            tags:
                - Rapports
            summary: Modifie un rapport de visite
            description: Met à jour le motif et le bilan d'un rapport. Seul le visiteur propriétaire peut modifier son rapport. **Middlewares:** requireAuth
            parameters:
                - in: path
                  name: id
                  schema:
                      type: integer
                  description: Identifiant du rapport
                  required: true
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RapportUpdateInput'
            responses:
                '200':
                    description: Rapport mis à jour avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessRapport'
                            examples:
                                success:
                                    $ref: '#/components/examples/ExampleUpdateRapportSuccess'
                '401':
                    description: Non authentifié (token manquant, invalide ou expiré)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                missingToken:
                                    $ref: '#/components/examples/ErrAuthTokenMissing'
                                invalidToken:
                                    $ref: '#/components/examples/ErrAuthTokenInvalid'
                                expiredToken:
                                    $ref: '#/components/examples/ErrAuthTokenExpired'
                '404':
                    description: Rapport non trouvé ou non autorisé
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                notFound:
                                    $ref: '#/components/examples/ErrRapportNotFound'
                '500':
                    description: Erreur serveur interne
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                internal:
                                    $ref: '#/components/examples/ErrDatabaseInternal'

        delete:
            tags:
                - Rapports
            summary: Supprime un rapport de visite
            description: Supprime un rapport existant. Seul le visiteur propriétaire peut supprimer son rapport. **Middlewares:** requireAuth
            parameters:
                - in: path
                  name: id
                  schema:
                      type: integer
                  description: Identifiant du rapport
                  required: true
            responses:
                '200':
                    description: Rapport supprimé avec succès
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiSuccessMessage'
                            examples:
                                success:
                                    $ref: '#/components/examples/ExampleDeleteRapportSuccess'
                '401':
                    description: Non authentifié (token manquant, invalide ou expiré)
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                missingToken:
                                    $ref: '#/components/examples/ErrAuthTokenMissing'
                                invalidToken:
                                    $ref: '#/components/examples/ErrAuthTokenInvalid'
                                expiredToken:
                                    $ref: '#/components/examples/ErrAuthTokenExpired'
                '404':
                    description: Rapport non trouvé ou non autorisé
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                notFound:
                                    $ref: '#/components/examples/ErrRapportNotFound'
                '500':
                    description: Erreur serveur interne
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApiErrorMessage'
                            examples:
                                internal:
                                    $ref: '#/components/examples/ErrDatabaseInternal'

components:
    schemas:
        RegisterInput:
            type: object
            required:
                - nom
                - prenom
                - login
                - mdp
                - adresse
                - cp
                - ville
            properties:
                nom:
                    type: string
                    maxLength: 30
                    description: Nom du visiteur
                prenom:
                    type: string
                    maxLength: 30
                    description: Prénom du visiteur
                login:
                    type: string
                    maxLength: 20
                    description: Identifiant unique de connexion
                mdp:
                    type: string
                    maxLength: 20
                    description: Mot de passe
                adresse:
                    type: string
                    maxLength: 30
                    description: Adresse du visiteur
                cp:
                    type: string
                    minLength: 5
                    maxLength: 5
                    pattern: '^\d{5}$'
                    description: Code postal (5 chiffres)
                ville:
                    type: string
                    maxLength: 30
                    description: Ville du visiteur

        LoginInput:
            type: object
            required:
                - login
                - mdp
            properties:
                login:
                    type: string
                    maxLength: 20
                    description: Identifiant de connexion
                mdp:
                    type: string
                    maxLength: 20
                    description: Mot de passe

        Visiteur:
            type: object
            required:
                - id
                - nom
                - prenom
                - login
                - mdp
                - adresse
                - cp
                - ville
                - timespan
            properties:
                id:
                    type: string
                    maxLength: 4
                    description: Identifiant unique généré (4 caractères alphanumériques)
                nom:
                    type: string
                    maxLength: 30
                    nullable: true
                    description: Nom du visiteur
                prenom:
                    type: string
                    maxLength: 30
                    nullable: true
                    description: Prénom du visiteur
                login:
                    type: string
                    maxLength: 20
                    nullable: true
                    description: Identifiant de connexion
                mdp:
                    type: string
                    maxLength: 20
                    nullable: true
                    description: Mot de passe
                adresse:
                    type: string
                    maxLength: 30
                    nullable: true
                    description: Adresse
                cp:
                    type: string
                    maxLength: 5
                    nullable: true
                    description: Code postal
                ville:
                    type: string
                    maxLength: 30
                    nullable: true
                    description: Ville
                dateEmbauche:
                    type: string
                    format: date
                    nullable: true
                    description: Date d'embauche
                timespan:
                    type: integer
                    format: int64
                    description: Timestamp ou durée (initialisé à 0 à la création)
                ticket:
                    type: string
                    maxLength: 50
                    nullable: true
                    description: Token ou ticket de session

        ApiSuccessVisiteur:
            type: object
            required:
                - success
                - data
                - message
            properties:
                success:
                    type: boolean
                    enum: [true]
                data:
                    $ref: '#/components/schemas/Visiteur'
                message:
                    type: string
                    description: Message de confirmation

        VisiteurPublic:
            type: object
            required:
                - id
                - nom
                - prenom
                - login
                - adresse
                - cp
                - ville
                - dateEmbauche
            properties:
                id:
                    type: string
                    maxLength: 4
                    description: Identifiant unique généré (4 caractères alphanumériques)
                nom:
                    type: string
                    maxLength: 30
                    nullable: true
                    description: Nom du visiteur
                prenom:
                    type: string
                    maxLength: 30
                    nullable: true
                    description: Prénom du visiteur
                login:
                    type: string
                    maxLength: 20
                    nullable: true
                    description: Identifiant de connexion
                adresse:
                    type: string
                    maxLength: 30
                    nullable: true
                    description: Adresse
                cp:
                    type: string
                    maxLength: 5
                    nullable: true
                    description: Code postal
                ville:
                    type: string
                    maxLength: 30
                    nullable: true
                    description: Ville
                dateEmbauche:
                    type: string
                    format: date
                    nullable: true
                    description: Date d'embauche

        ApiSuccessVisiteurPublic:
            type: object
            required:
                - success
                - data
                - message
            properties:
                success:
                    type: boolean
                    enum: [true]
                data:
                    $ref: '#/components/schemas/VisiteurPublic'
                message:
                    type: string
                    description: Message de confirmation

        ApiSuccessMessage:
            type: object
            required:
                - success
                - message
            properties:
                success:
                    type: boolean
                    enum: [true]
                message:
                    type: string
                    description: Message de succès

        ApiValidationError:
            type: object
            required:
                - success
                - errors
            properties:
                success:
                    type: boolean
                    enum: [false]
                errors:
                    type: object
                    description: Erreurs de validation par champ
                    additionalProperties:
                        type: array
                        items:
                            type: string

        ApiErrorMessage:
            type: object
            required:
                - success
                - message
            properties:
                success:
                    type: boolean
                    enum: [false]
                message:
                    type: string
                    description: Message d'erreur

        Medecin:
            type: object
            required:
                - id
                - nom
                - prenom
                - adresse
                - departement
            properties:
                id:
                    type: integer
                    description: Identifiant unique du médecin
                nom:
                    type: string
                    description: Nom de famille du praticien
                prenom:
                    type: string
                    description: Prénom du praticien
                adresse:
                    type: string
                    description: Adresse complète du cabinet ou du lieu d'exercice
                tel:
                    type: string
                    nullable: true
                    description: Numéro de téléphone (nullable)
                specialitecomplementaire:
                    type: string
                    nullable: true
                    description: Spécialité complémentaire optionnelle
                departement:
                    type: integer
                    description: Code du département de localisation

        ApiSuccessMedecins:
            type: object
            required:
                - success
                - data
                - message
            properties:
                success:
                    type: boolean
                    enum: [true]
                data:
                    type: object
                    required:
                        - items
                        - total
                        - limit
                        - offset
                    properties:
                        items:
                            type: array
                            items:
                                $ref: '#/components/schemas/Medecin'
                            description: Liste des médecins de la page courante
                        total:
                            type: integer
                            description: Nombre total de médecins en base de données
                        limit:
                            type: integer
                            description: Taille de la page (fixée à 30)
                        offset:
                            type: integer
                            description: Offset utilisé pour la requête
                message:
                    type: string
                    description: Message de confirmation

        Rapport:
            type: object
            required:
                - id
                - idVisiteur
                - idMedecin
            properties:
                id:
                    type: integer
                    description: Identifiant unique du rapport
                date:
                    type: string
                    format: date
                    nullable: true
                    description: Date de la visite
                motif:
                    type: string
                    maxLength: 100
                    nullable: true
                    description: Motif de la visite
                bilan:
                    type: string
                    maxLength: 100
                    nullable: true
                    description: Bilan de la visite
                idVisiteur:
                    type: string
                    maxLength: 4
                    description: Identifiant du visiteur
                idMedecin:
                    type: integer
                    description: Identifiant du médecin visité

        RapportUpdateInput:
            type: object
            properties:
                motif:
                    type: string
                    maxLength: 100
                    nullable: true
                    description: Nouveau motif de la visite
                bilan:
                    type: string
                    maxLength: 100
                    nullable: true
                    description: Nouveau bilan de la visite

        ApiSuccessRapports:
            type: object
            required:
                - success
                - data
                - message
            properties:
                success:
                    type: boolean
                    enum: [true]
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/Rapport"
                    description: Liste des rapports
                message:
                    type: string
                    description: Message de confirmation

        ApiSuccessRapport:
            type: object
            required:
                - success
                - data
                - message
            properties:
                success:
                    type: boolean
                    enum: [true]
                data:
                    $ref: "#/components/schemas/Rapport"
                    description: Rapport mis à jour
                message:
                    type: string
                    description: Message de confirmation

    examples:
        ExampleRegisterSuccess:
            summary: Création réussie
            value:
                success: true
                message: Visiteur créé avec succès

        ExampleLoginSuccess:
            summary: Authentification réussie
            value:
                success: true
                data:
                    id: aBc1
                    nom: Dupont
                    prenom: Jean
                    login: jdupont
                    adresse: 123 Rue de Paris
                    cp: '75001'
                    ville: Paris
                    dateEmbauche: '2020-06-15'
                message: Connexion réussie

        ExampleLogoutSuccess:
            summary: Déconnexion réussie
            value:
                success: true
                message: Déconnexion réussie

        ErrZodMissingField:
            summary: Champ requis manquant
            value:
                success: false
                errors:
                    login:
                        - Le login est requis

        ErrZodFieldTooLong:
            summary: Champ trop long
            value:
                success: false
                errors:
                    nom:
                        - Le nom ne doit pas dépasser 30 caractères

        ErrZodLoginMissing:
            summary: Champ login manquant
            value:
                success: false
                errors:
                    login:
                        - Le login est requis

        ErrZodLoginTooLong:
            summary: Login trop long
            value:
                success: false
                errors:
                    login:
                        - Le login ne doit pas dépasser 20 caractères

        ErrAuthInvalidCredentials:
            summary: Identifiants invalides
            value:
                success: false
                message: Identifiants invalides

        ErrConflictLoginExists:
            summary: Login déjà utilisé
            value:
                success: false
                message: Un visiteur avec ce login existe déjà

        ExampleMeSuccess:
            summary: Connexion réussie
            value:
                success: true
                data:
                    id: aBc1
                    nom: Dupont
                    prenom: Jean
                    login: jdupont
                    adresse: 123 Rue de Paris
                    cp: '75001'
                    ville: Paris
                    dateEmbauche: '2020-06-15'
                message: Connexion réussie

        ErrAuthTokenMissing:
            summary: Token manquant
            value:
                success: false
                message: Token manquant

        ErrAuthTokenInvalid:
            summary: Token invalide
            value:
                success: false
                message: Token invalide

        ErrAuthTokenExpired:
            summary: Token expiré
            value:
                success: false
                message: Token expiré

        ErrDatabaseInternal:
